<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="286" viewBox="0 0 1060 286" role="img" aria-labelledby="title description">
  <title id="title">GitHub public repository snapshot for xKQAx</title>
  <desc id="description">A custom stats card. The public repository count is current; the remaining metrics will populate after the first workflow run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1060" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10182B"/><stop offset="1" stop-color="#17142D"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65D9FF"/><stop offset="1" stop-color="#A27BFF"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#AAB7FF" fill-opacity=".08"/>
    </pattern>
    <style>
      .label { fill:#9BA9C8;font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1.2px }
      .value { fill:#F3F6FF;font:700 34px 'Segoe UI',Arial,sans-serif }
      .pending { fill:#697895;font:600 21px 'Segoe UI',Arial,sans-serif }
      .meta { fill:#8290AF;font:500 10px 'Segoe UI',Arial,sans-serif;letter-spacing:.6px }
    </style>
  </defs>
  <rect x="1" y="1" width="1058" height="284" rx="20" fill="url(#bg)" stroke="#293451" stroke-width="2"/>
  <rect x="2" y="2" width="1056" height="282" rx="19" fill="url(#dots)"/>
  <rect x="48" y="28" width="58" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="118" y="34" class="label">PUBLIC CODE · XKQAX</text>
  <text x="48" y="86" class="label">PUBLIC REPOS</text>
  <text x="48" y="132" class="value">39</text>
  <path d="M276 52v98M528 52v98M780 52v98" stroke="#293451"/>
  <text x="300" y="86" class="label">STARS EARNED</text>
  <text x="300" y="132" class="pending">…</text>
  <text x="552" y="86" class="label">FORKS</text>
  <text x="552" y="132" class="pending">…</text>
  <text x="804" y="86" class="label">LANGUAGES</text>
  <text x="804" y="132" class="pending">…</text>
  <path d="M48 169h964" stroke="#293451"/>
  <text x="48" y="204" class="label">YOUR LIVE REPOSITORY BREAKDOWN IS READY TO GENERATE</text>
  <text x="48" y="230" class="meta">The profile-stats workflow fills in stars, forks, and language mix after it runs on GitHub.</text>
  <text x="1012" y="263" text-anchor="end" class="meta">WEEKLY REFRESH · GITHUB PUBLIC API</text>
</svg>
